name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --all-packages --all-groups --locked

      - name: Run backend unit tests
        env:
          DB_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/dnd_test
          JWT_SECRET_KEY: test-secret
          BOT_API_SECRET: test-bot-secret
          GEMINI_API_KEY: test-gemini-key
          DEFAULT_AI_MODEL: test-model
          REDIS_URL: redis://localhost:6379/0
          RABBITMQ_URL: amqp://guest:guest@localhost:5672/
          RABBITMQ_EXCHANGE: dnd.events
          RABBITMQ_QUEUE_PREFIX: backend
          ENVIRONMENT: test
        run: uv run pytest backend/tests/unit

      - name: Run bot tests
        env:
          BOT_TOKEN: 12345:test-token
          ENVIRONMENT: test
        run: uv run pytest bot/tests

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dnd_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d dnd_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      rabbitmq:
        image: rabbitmq:3-management-alpine
        env:
          RABBITMQ_DEFAULT_USER: guest
          RABBITMQ_DEFAULT_PASS: guest
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --all-packages --all-groups --locked

      - name: Run backend integration tests
        env:
          DB_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/dnd_test
          JWT_SECRET_KEY: test-secret
          BOT_API_SECRET: test-bot-secret
          GEMINI_API_KEY: test-gemini-key
          DEFAULT_AI_MODEL: test-model
          REDIS_URL: redis://localhost:6379/0
          RABBITMQ_URL: amqp://guest:guest@localhost:5672/
          RABBITMQ_EXCHANGE: dnd.events
          RABBITMQ_QUEUE_PREFIX: backend
          ENVIRONMENT: test
        run: uv run pytest backend/tests/integration
