[project]
name = "backend"
version = "0.2.0"
description = "A comprehensive API for managing D&D character sheets"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aio-pika>=9.5",
    "alembic>=1.18.4",
    "asyncpg>=0.31.0",
    "bcrypt>=5.0.0",
    "fastapi>=0.135.3",
    "google-genai>=1.0",
    "pydantic-settings>=2.13.1",
    "pydantic[email]>=2.13.1",
    "pyjwt>=2.12.1",
    "redis>=5.0",
    "uvicorn>=0.44.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "aiosqlite>=0.21.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
