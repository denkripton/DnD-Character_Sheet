services:
  nginx:
    profiles: [production]

  frontend-dev:
    image: node:22-alpine
    working_dir: /app/mini-app/config
    volumes:
      - ./mini-app:/app/mini-app:z
    ports:
      - "127.0.0.1:5173:5173"
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    command:
      - sh
      - -c
      - npm ci && npm run dev -- --host 0.0.0.0
    networks:
      - internal

  backend:
    build:
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    volumes:
      - ./backend:/app/backend:z
      - /app/backend/.venv
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      ENVIRONMENT: development
      MINI_APP_ALLOWED_ORIGINS: '["http://localhost:5173"]'
    command:
      - uvicorn
      - src.api:api.app
      - --host
      - "0.0.0.0"
      - --port
      - "8000"
      - --reload
      - --no-access-log

  bot:
    build:
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    volumes:
      - ./bot:/app/bot:z
      - ./backend:/app/backend:z
    environment:
      ENVIRONMENT: development
      MINI_APP_URL: http://localhost:5173
    command:
      - python
      - -m
      - app.main

networks:
  internal:
    internal: false
